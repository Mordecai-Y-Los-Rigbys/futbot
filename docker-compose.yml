services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: futbot_user
      POSTGRES_PASSWORD: futbot_pass
      POSTGRES_DB: futbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicialización Postgres levanta un
      # servidor temporal que solo escucha en el socket unix, y sin -h el
      # chequeo daría "listo" demasiado pronto.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://futbot_user:futbot_pass@db:5432/futbot_db
      - FRONTEND_URL=http://localhost:3000
    volumes:
      # Sincroniza la carpeta local con el contenedor para hot-reload
      - .:/app:z
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --ws websockets-sansio --ws-ping-interval 20 --ws-ping-timeout 20
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: