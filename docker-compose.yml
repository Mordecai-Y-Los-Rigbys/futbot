services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: futbot_user
      POSTGRES_PASSWORD: futbot_pass
      POSTGRES_DB: futbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://futbot_user:futbot_pass@db:5432/futbot_db
      - FRONTEND_URL=http://localhost:3000
    volumes:
      # Sincroniza la carpeta local con el contenedor para hot-reload
      - .:/app:z
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --ws websockets --ws-ping-interval 20 --ws-ping-timeout 20
    depends_on:
      - db

volumes:
  postgres_data: